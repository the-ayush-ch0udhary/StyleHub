{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete — StyleHub{% endblock %}

{% block content %}
<div class="container my-5 text-center" style="max-width: 480px;">
  <div class="sh-card p-5">
    <i class="bi bi-shield-check display-3 text-success mb-3 d-inline-block"></i>
    <h3 class="fw-bold mb-2">Password Reset Successful</h3>
    <p class="text-muted small mb-4">
      Your password has been changed. You may now log in with your new credentials.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-sh-primary px-4 py-2">
      Sign In
    </a>
  </div>
</div>
{% endblock %}

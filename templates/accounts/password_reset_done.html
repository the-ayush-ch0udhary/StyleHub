{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Link Sent — StyleHub{% endblock %}

{% block content %}
<div class="container my-5 text-center" style="max-width: 480px;">
  <div class="sh-card p-5">
    <i class="bi bi-envelope-check display-3 text-success mb-3 d-inline-block"></i>
    <h3 class="fw-bold mb-2">Check Your Inbox</h3>
    <p class="text-muted small mb-4">
      If an account exists with the email you entered, we've sent password reset instructions.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-sh-primary px-4 py-2">
      Return to Sign In
    </a>
  </div>
</div>
{% endblock %}

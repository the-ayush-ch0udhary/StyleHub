{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password — StyleHub{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 480px;">
  <div class="sh-card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock display-4 text-warning mb-2 d-inline-block"></i>
      <h3 class="fw-bold mb-1">Reset Password</h3>
      <p class="text-muted small">Enter your email address and we will send you a secure link to reset your password.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label">Account Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <button type="submit" class="btn btn-sh-primary w-100 py-2">
        Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top small">
      <a href="{% url 'accounts:login' %}" class="text-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
